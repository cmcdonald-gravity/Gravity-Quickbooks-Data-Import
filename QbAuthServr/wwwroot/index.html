<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickBooks Connector</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1 id="title">QuickBooks Connection</h1>

    <!-- CONNECT STATE -->
    <section id="connectState" class="panel" hidden>
      <p class="muted">Click below to connect your QuickBooks account.</p>
      <button id="connectQB" class="btn-primary">Connect to QuickBooks</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <!-- CONNECTED STATE -->
    <section id="connectedState" class="panel" hidden>
      <!-- Bills -->
      <h2>Bills</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="importBtn"   class="btn-success">Import Bills</button>
        <button id="downloadBtn" class="btn-primary" style="display:none;">Download Vouchers (.xlsx)</button>
      </div>
      <p id="importStatus" class="status" aria-live="polite"></p>

      <hr style="margin:24px 0; opacity:.3;" />

      <!-- Chart of Accounts -->
      <h2>Chart of Accounts</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button id="accountsImportBtn"   class="btn-success">Import Chart of Accounts</button>
        <button id="accountsDownloadBtn" class="btn-primary" style="display:none;">Download Chart of Accounts (.xlsx)</button>
      </div>
      <p id="accountsStatus" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
