<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickBooks Connector</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1 id="title">QuickBooks Connection</h1>

    <!-- CONNECT STATE -->
    <section id="connectState" class="panel" hidden>
      <p class="muted">Click below to connect your QuickBooks account.</p>
      <button id="connectQB" class="btn-primary">Connect to QuickBooks</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <!-- CONNECTED STATE -->
    <section id="connectedState" class="panel" hidden>
      <button id="importBtn" class="btn-success">Import Transactions</button>
      <p id="importStatus" class="status" aria-live="polite"></p>

      <div id="results" class="results"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
