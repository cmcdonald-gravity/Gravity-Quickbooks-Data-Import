services:
  - type: web
    name: gravity-import
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATA_DIR
        value: /data
      # Set these in the Render dashboard as "fromDatabase"/"sync: false" if you prefer
      - key: QuickBooks:ClientId
        sync: false
      - key: QuickBooks:ClientSecret
        sync: false
      - key: QuickBooks:RedirectUri
        # fill after the first deploy with your actual onrender URL:
        value: https://gravity-import.onrender.com/auth/quickbooks/callback