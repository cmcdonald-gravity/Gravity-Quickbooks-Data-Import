services:
  - type: web
    name: gravity-import
    env: docker
    plan: free
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATA_DIR
        value: /data
      - key: QuickBooks__ClientId
        sync: false
      - key: QuickBooks__ClientSecret
        sync: false
      - key: QuickBooks__RedirectUri
        value: https://gravity-quickbooks-data-import.onrender.com/auth/quickbooks/callback